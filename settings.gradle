pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.library' version '9.4.1'
        id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
    }
}

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'TamarinOpenXrBindings'

// The Java API (generated from xr.xml) and the runtime it needs; the same on every platform
include 'openxr-bindings-core'
// The native library for Android (arm64-v8a) plus the Android only parts (loader initialisation)
include 'openxr-bindings-android'
// The native libraries for desktop (Windows and Linux)
include 'openxr-bindings-desktop'
