import com.onemillionworlds.tamarin.gradle.tasks.ParseOpenXr

import java.security.MessageDigest

plugins {
    // Apply the Android library plugin
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
    id 'com.onemillionworlds.tamarin.createstructs'
}

group = "com.onemillionworlds.tamarin"
version = project.version

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    google()
}

android {
    namespace = 'com.onemillionworlds.tamarin.openxrbindings'
    compileSdk = 34

    // Specify the manifest file location
    sourceSets {
        main {
            manifest.srcFile('AndroidManifest.xml')
            java.srcDirs = ['src/main/java']
            // Wire generated sources so any task consuming sources (compile, sourcesJar, javadoc, etc.)
            // will automatically run parseOpenXrFile first via builtBy linkage.
            java.srcDir(files("src/main/generated/java").builtBy('parseOpenXrFile'))
        }
        test {
            java.srcDirs = ['src/test/java']
            resources.srcDirs = ['src/test/resources']
        }
    }

    defaultConfig {
        minSdk = 26
        targetSdk = 34

        // Configure CMake
        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        // Specify which ABIs to build for
        ndk {
            abiFilters 'arm64-v8a' // other values  'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    // Lets CMake find_package() native libraries from AAR dependencies (the OpenXR loader)
    buildFeatures {
        prefab = true
    }

    // The loader .so comes to consumers transitively via the Khronos AAR (see dependencies). Don't also bundle the copy
    // CMake links against, or consumers get two libopenxr_loader.so files and a duplicate native lib merge failure
    packaging {
        jniLibs {
            excludes += ['**/libopenxr_loader.so']
        }
    }

    // Link to CMakeLists.txt
    externalNativeBuild {
        cmake {
            path = file("src/native/CMakeLists.txt")
        }
    }

    // Configure build types
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Configure Java compatibility
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    // Specify Java toolchain
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(11)
        }
    }

}

// Configure Java compiler to generate JNI header files
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-h", "${project.projectDir}/src/native/headers"]
}

// Configure the CreateStructs task
def generatedOutputDir = file("${project.projectDir}/src/main/generated/java/com/onemillionworlds/tamarin/openxrbindings")
def generatedCOutputDir = file("${project.projectDir}/src/main/generated/native/src")
// The OpenXR registry (xr.xml), which all the Java and C bindings are generated from, is not vendored. It is
// downloaded from the Khronos release tag matching the loader version (openxr-loader in gradle/libs.versions.toml) so
// the generated API, the headers the C compiles against (from the loader AAR via prefab) and the runtime loader
// always agree
def openxrVersion = libs.versions.openxr.loader.get()
// SHA-256 of xr.xml at release-${openxrVersion}. Must be updated whenever openxr-loader is bumped
def xrXmlSha256 = 'e9b6b0bb9e5100c56467ec80ae30b78ff36b4dcc8a332c269fa5e3e8429ed0aa'
def openxrSpecDir = layout.buildDirectory.dir("openxrSpec")

def downloadXrXml = tasks.register('downloadXrXml') {
    description = 'Downloads the OpenXR registry (xr.xml) matching the OpenXR loader version'
    def url = "https://raw.githubusercontent.com/KhronosGroup/OpenXR-SDK-Source/release-${openxrVersion}/specification/registry/xr.xml"
    def outputFile = openxrSpecDir.map { it.file('xr.xml') }
    inputs.property('url', url)
    inputs.property('sha256', xrXmlSha256)
    outputs.file(outputFile)
    doLast {
        def bytes = new URL(url).openStream().withCloseable { it.bytes }
        def actualSha256 = MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        if (actualSha256 != xrXmlSha256) {
            throw new GradleException("xr.xml from ${url} has SHA-256 ${actualSha256} but ${xrXmlSha256} was expected. " +
                    "If openxr-loader was bumped, review the new xr.xml and update xrXmlSha256 in android-native/build.gradle")
        }
        outputFile.get().asFile.bytes = bytes
    }
}

// Create the output directories
def createGeneratedDirs = tasks.register('createGeneratedDirs') {
    doLast {
        generatedOutputDir.mkdirs()
        generatedCOutputDir.mkdirs()
    }
}

def parseOpenXrFile = tasks.register('parseOpenXrFile', ParseOpenXr) {
    dependsOn createGeneratedDirs, downloadXrXml
    xrXml = openxrSpecDir.map { it.file('xr.xml') }
    outputDir = generatedOutputDir
    cOutputDir = generatedCOutputDir
}

// Make sure the CreateStructs task runs before Java compilation (and Kotlin compilation, which AGP 9 always
// registers and which also reads the java source dirs)
tasks.withType(JavaCompile).configureEach { task ->
    task.dependsOn parseOpenXrFile
}
tasks.named { n -> n.startsWith("compile") && n.endsWith("Kotlin") }.configureEach { task ->
    task.dependsOn parseOpenXrFile
}

// Ensure tasks that read the generated sources (annotation extraction, javadoc, sources jar) depend on parseOpenXrFile
tasks.named { n ->
    (n.startsWith("extract") && n.endsWith("Annotations")) ||
    (n.startsWith("javaDoc") && n.endsWith("Generation")) ||
    n == "sourceReleaseJar"
}.configureEach { task ->
    task.dependsOn parseOpenXrFile
}

// Ensure native build (CMake/externalNativeBuild) runs after generating sources
// This guarantees the generated C file exists before CMake config/build tasks
// Covers various AGP task names across versions
tasks.named { n ->
    (n.startsWith("externalNativeBuild") ||
     n.startsWith("configureCMake") ||
     (n.startsWith("generate") && n.contains("CMake"))) && !n.contains("clean")
}.configureEach { task ->
    task.dependsOn parseOpenXrFile
}

// An IDE sync configures CMake directly from the model builder, without running any of the tasks above, so on a clean
// checkout CMake can't find the generated C file. prepareKotlinBuildScriptModel is the task the IDE runs before building
// its models, so generate the sources then
rootProject.tasks.matching { it.name == "prepareKotlinBuildScriptModel" }.configureEach { task ->
    task.dependsOn parseOpenXrFile
}

dependencies {
    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api libs.commons.math3

    // The OpenXR loader (libopenxr_loader.so), exposed via prefab to our CMake build. Exported as api so consumers
    // resolve a single copy of the loader (and get its manifest entries) even if they also depend on it directly
    api libs.openxr.loader

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation libs.guava

    // Android testing dependencies
    testImplementation libs.junit.jupiter.api
    testImplementation libs.jupiter.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Android testing configuration
android.testOptions {
    unitTests {
        includeAndroidResources = true
        // Use JUnit Platform (JUnit 5)
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

// Task to update reference struct files with the current generated files
// This task is not part of the normal build process and should be run explicitly
// when you want to accept changes to the generated structs
// Only updates existing reference files, never creates new ones
tasks.register('updateReferenceStructs') {
    description = 'Updates existing reference struct files with the current generated files'
    group = 'Verification'

    doLast {
        def generatedDir = file("${project.projectDir}/src/main/generated/java/com/onemillionworlds/tamarin/openxrbindings")
        def referenceDir = file("${project.projectDir}/src/test/resources/referenceStructs")

        // Ensure reference directory exists
        if (!referenceDir.exists()) {
            referenceDir.mkdirs()
        }

        // Find all existing reference files
        def existingReferenceFiles = referenceDir.listFiles().findAll { 
            it.name.endsWith("_reference.java") 
        }

        println "Found ${existingReferenceFiles.size()} existing reference files"

        // Count of updated files
        def updatedCount = 0

        // For each existing reference file, find the corresponding generated file and update it
        existingReferenceFiles.each { referenceFile ->
            def baseName = referenceFile.name.replace("_reference.java", "")
            def generatedFile = new File(generatedDir, "${baseName}.java")

            if (generatedFile.exists()) {
                // Read the generated file content
                def content = generatedFile.text

                // Write to the reference file
                referenceFile.text = content

                updatedCount++
                println "Updated reference file: ${referenceFile.name}"
            } else {
                println "Warning: Generated file not found for reference: ${referenceFile.name}"
            }
        }

        println "Reference struct files update complete. Updated ${updatedCount} files."
    }
}

// Use the new Android publishing DSL
android {
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                groupId = group
                artifactId = 'openxr-bindings-native'
                version = version

                from components.release

                pom {
                    name = 'Tamarin OpenXR Native Bindings'
                    description = 'Native bindings for OpenXR on Android'
                    url = 'https://github.com/oneMillionWorlds/TamarinOpenXrAndroidBindings'

                    licenses {
                        license {
                            name = 'BSD 3-Clause License'
                            url = 'https://opensource.org/licenses/BSD-3-Clause'
                            distribution = 'repo'
                        }
                    }

                    scm {
                        url = 'https://github.com/oneMillionWorlds/TamarinOpenXrAndroidBindings'
                        connection = 'scm:git:https://github.com/oneMillionWorlds/TamarinOpenXrAndroidBindings.git'
                        developerConnection = 'scm:git:ssh://git@github.com/oneMillionWorlds/TamarinOpenXrAndroidBindings.git'
                        tag = 'HEAD'
                    }

                    developers {
                        developer {
                            id = 'richard-tingle'
                            name = 'Richard Tingle'
                            organization = 'oneMillionWorlds'
                            organizationUrl = 'https://github.com/oneMillionWorlds'
                        }
                    }
                }
            }
        }
        repositories {
            // Local publishing for development/testing
            mavenLocal()
            // Local directory used to assemble a Central Portal bundle (staging area)
            // This keeps publishToMavenLocal working and avoids pushing to OSSRH.
            maven {
                name = 'CentralPortalStaging'
                url = centralPortalStagingDir.get().asFile
            }
            // Sonatype OSSRH (legacy) — left in place for local testing only; CI no longer uses it
            maven {
                name = 'SonaType'
                url = uri('https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/')
                credentials {
                    username = findProperty('ossrhUsername') ?: System.getenv('OSSRH_USERNAME')
                    password = findProperty('ossrhPassword') ?: System.getenv('OSSRH_PASSWORD')
                }
            }
        }
    }
    // Sign the publication if signing properties are present
    signing {
        def hasSigning = project.hasProperty('signing.keyId') || project.hasProperty('signingKey') || project.hasProperty('signing.secretKeyRingFile')
        if (hasSigning) {
            sign publishing.publications.mavenJava
        }
    }
}

// Ensure `gradlew clean` removes the generated sources and native code under src/main/generated
// We delete the whole directory; it will be recreated by `createGeneratedDirs`/`parseOpenXrFile` during the next build.
tasks.register('cleanGenerated', Delete) {
    delete file("${project.projectDir}/src/main/generated")
}

tasks.named('clean') {
    dependsOn 'cleanGenerated'
}


// --- Central Publisher API integration (USER_MANAGED) ---
ext.centralPortalStagingDir = layout.buildDirectory.dir('central-portal-staging')

// Helper task alias with clearer name
tasks.register('publishToCentralPortalStaging') {
    dependsOn 'publishMavenJavaPublicationToCentralPortalStagingRepository'
    group = 'publishing'
    description = 'Publishes the mavenJava publication to local Central Portal staging directory.'
}

tasks.register('zipCentralPortalBundle', Zip) {
    group = 'publishing'
    description = 'Zips the Central Portal staging directory into build/central-bundle.zip'
    dependsOn 'publishToCentralPortalStaging'
    from(centralPortalStagingDir)
    archiveFileName = 'central-bundle.zip'
    destinationDirectory = layout.buildDirectory
}

tasks.register('prepareCentralBundle') {
    group = 'publishing'
    description = 'Stages and zips artifacts ready for Central Publisher Portal upload (no network).'
    dependsOn 'zipCentralPortalBundle'
}

tasks.register('publishViaCentralPortal') {
    group = 'publishing'
    description = 'Stages and zips artifacts ready for Central Publisher Portal upload (no network).'
    dependsOn 'prepareCentralBundle'
}
